        /**
         * Reusable Section Wrapper
         * უზრუნველყოფს ერთიან დიზაინს, სათაურს, სუბტიტრს და ბეიჯს

                                {title}
                            </h2>
                            {subtitle && (
                                <p className="text-xs sm:text-sm text-slate-500 mt-3">{subtitle}</p>

                        </div>
                        {badge && (
                            <div className="self-start sm:self-auto">{badge}</div>

                    </div>

                </section>

        }

         */
        function SkillCard({ title, description, icon = '💡', borderClass = 'border-l-blue-600', badge }) {
            return (
                <div
                    className={`bg-white p-5 rounded-2xl border border-slate-100 shadow-sm border-l-4 ${borderClass} hover:-translate-y-1 hover:shadow-md transition-all duration-200 flex flex-col justify-between`}

                                    <clipPath id="s">

         * Header და Navigation კომპონენტი (Burger Menu State-ით)

                                            ))}

                                    </div>
                                )}

                                <ul className="flex items-center gap-1.5 bg-slate-100/90 border border-slate-200 p-1.5 rounded-full shadow-inner">
                                    {navLinks.map((link) => (
                                        <li key={link.href}>
                                            <a
                                                href={link.href}
                                                className="px-3.5 py-1.5 text-xs lg:text-sm font-semibold text-slate-700 hover:text-blue-600 hover:bg-white rounded-full transition-all duration-200 block shadow-sm hover:shadow"
                                            >
                                                {link.label}
                                            </a>
                                        </li>
                                    ))}
                                </ul>
                            </nav>
                        </div>
                    </div>
                </header>
            );
        }

        /**
         * About Section კომპონენტი
         */
        function AboutSection() {
            return (
                <Section id="about" title="ჩემ შესახებ">
                    <div className="flex flex-col md:flex-row gap-8 items-center md:items-start">
                        <div className="flex-1 order-2 md:order-1 text-slate-700 leading-relaxed text-base sm:text-lg">
                            <p>
                                გამარჯობა! მე ვარ <strong className="text-slate-900 font-bold">ნიკა აშვეთია</strong>, მე-9 კლასის
                                მოსწავლე ტყაჩირიდან.
                            </p>
                            <p className="mt-3">
                                ამჟამად აქტიურად ვსწავლობ{' '}
                                <strong className="text-blue-600 font-bold">Full Stack Development</strong>-ს და მიზნად მაქვს შევქმნა
                                თანამედროვე ვებსაიტები და აპლიკაციები React-ის კომპონენტური მიდგომით.
                            </p>
                        </div>
                        <figure className="order-1 md:order-2 flex-shrink-0 bg-white p-3 rounded-2xl border border-slate-200 shadow-md text-center transform hover:rotate-1 hover:scale-105 transition-all duration-300">
                            <img
                                src="photo/messi.jpg"
                                alt="ლეო მესი"
                                className="w-52 h-52 object-cover rounded-xl shadow-inner mx-auto"
                            />
                            <figcaption className="mt-2.5 inline-block bg-blue-50 text-blue-600 font-bold text-xs px-3 py-1 rounded-full">
                                ლეო მესი
                            </figcaption>
                        </figure>
                    </div>
                </Section>
            );
        }

        /**
         * Users Section კომპონენტი (API Fetching + Reusable UserCard)
         */
        function UsersSection() {
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                fetch('https://jsonplaceholder.typicode.com/users')
                    .then((res) => {
                        if (!res.ok) throw new Error(`HTTP სტატუსი: ${res.status}`);
                        return res.json();
                    })
                    .then((data) => {
                        setUsers(data);
                        setLoading(false);
                    })
                    .catch((err) => {
                        console.error('მომხმარებლების შეცდომა:', err);
                        setError(err.message);
                        setLoading(false);
                    });
            }, []);

            const badge = (
                <span className="inline-flex items-center gap-1.5 bg-blue-50 text-blue-700 text-xs font-semibold px-3 py-1 rounded-full border border-blue-200">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    სულ: {users.length > 0 ? `${users.length} მომხმარებელი` : 'იტვირთება...'}
                </span>
            );

            return (
                <Section
                    id="users"
                    title="მომხმარებლები (API)"
                    subtitle="მონაცემები ჩატვირთულია https://jsonplaceholder.typicode.com/users-იდან"
                    badge={badge}
                >
                    {loading && (
                        <div className="text-center py-8 text-slate-400 text-sm flex items-center justify-center gap-2">
                            <svg className="animate-spin h-5 w-5 text-blue-600" viewBox="0 0 24 24" fill="none">
                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                            </svg>
                            <span>იტვირთება მომხმარებლების სია...</span>
                        </div>
                    )}

                    {error && (
                        <div className="p-4 rounded-xl bg-red-50 text-red-600 text-sm text-center border border-red-200">
                            შეცდომა მონაცემების ჩატვირთვისას: {error}
                        </div>
                    )}

                    {!loading && !error && (
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            {users.map((user) => (
                                <UserCard
                                    key={user.id}
                                    name={user.name}
                                    email={user.email}
                                    phone={user.phone}
                                    company={user.company}
                                />
                            ))}
                        </div>
                    )}
                </Section>
            );
        }

        /**
         * Comments Section კომპონენტი (API Fetching + Reusable CommentCard)
         */
        function CommentsSection() {
            const [comments, setComments] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                fetch('https://jsonplaceholder.typicode.com/comments?_limit=5')
                    .then((res) => {
                        if (!res.ok) throw new Error(`HTTP სტატუსი: ${res.status}`);
                        return res.json();
                    })
                    .then((data) => {
                        setComments(data);
                        setLoading(false);
                    })
                    .catch((err) => {
                        console.error('კომენტარების შეცდომა:', err);
                        setError(err.message);
                        setLoading(false);
                    });
            }, []);

            const badge = (
                <span className="inline-flex items-center gap-1.5 bg-amber-50 text-amber-700 text-xs font-semibold px-3 py-1 rounded-full border border-amber-200">
                    <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                    ნაჩვენებია: {comments.length} კომენტარი
                </span>
            );

            return (
                <Section
                    id="comments"
                    title="კომენტარები (API)"
                    subtitle="მონაცემები ჩატვირთულია https://jsonplaceholder.typicode.com/comments-იდან"
                    badge={badge}
                >
                    {loading && (
                        <div className="text-center py-8 text-slate-400 text-sm flex items-center justify-center gap-2">
                            <svg className="animate-spin h-5 w-5 text-amber-500" viewBox="0 0 24 24" fill="none">
                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                            </svg>
                            <span>იტვირთება კომენტარები...</span>
                        </div>
                    )}

                    {error && (
                        <div className="p-4 rounded-xl bg-red-50 text-red-600 text-sm text-center border border-red-200">
                            შეცდომა კომენტარების ჩატვირთვისას: {error}
                        </div>
                    )}

                    {!loading && !error && (
                        <div className="space-y-4">
                            {comments.map((comment, index) => (
                                <CommentCard
                                    key={comment.id}
                                    index={index + 1}
                                    id={comment.id}
                                    name={comment.name}
                                    email={comment.email}
                                    body={comment.body}
                                />
                            ))}
                        </div>
                    )}
                </Section>
            );
        }

        /**
         * Contact Section & Form კომპონენტი (Controlled Form Component)
         */
        function ContactSection() {
            const [formData, setFormData] = useState({ name: '', email: '', message: '' });
            const [submitted, setSubmitted] = useState(false);
            const [loading, setLoading] = useState(false);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData((prev) => ({ ...prev, [name]: value }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.name.trim() || !formData.email.trim() || !formData.message.trim()) return;
                setLoading(true);
                setTimeout(() => {
                    setLoading(false);
                    setSubmitted(true);
                    setFormData({ name: '', email: '', message: '' });
                }, 500);
            };

            return (
                <Section
                    id="contact"
                    title="დამიკავშირდით"
                    subtitle="შეგიძლიათ მომწეროთ შეტყობინება ქვემოთ მოცემული ფორმის საშუალებით:"
                >
                    {submitted && (
                        <div className="mb-6 p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-800 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <span className="text-xl">✅</span>
                                <p className="text-sm font-semibold">
                                    მადლობა! თქვენი შეტყობინება წარმატებით გაიგზავნა.
                                </p>
                            </div>
                            <button
                                type="button"
                                onClick={() => setSubmitted(false)}
                                className="text-xs font-bold text-emerald-700 hover:text-emerald-900 underline ml-2 cursor-pointer"
                            >
                                დახურვა
                            </button>
                        </div>
                    )}

                    <form
                        onSubmit={handleSubmit}
                        className="space-y-5 bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-sm"
                    >
                        <div>
                            <label
                                htmlFor="user-name"
                                className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2"
                            >
                                თქვენი სახელი *
                            </label>
                            <input
                                type="text"
                                id="user-name"
                                name="name"
                                value={formData.name}
                                onChange={handleChange}
                                required
                                placeholder="მაგ: გიორგი"
                                className="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-600 focus:bg-white transition-all text-sm sm:text-base"
                            />
                        </div>

                        <div>
                            <label
                                htmlFor="user-email"
                                className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2"
                            >
                                თქვენი ელ-ფოსტა *
                            </label>
                            <input
                                type="email"
                                id="user-email"
                                name="email"
                                value={formData.email}
                                onChange={handleChange}
                                required
                                placeholder="მაგ: example@mail.com"
                                className="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-600 focus:bg-white transition-all text-sm sm:text-base"
                            />
                        </div>

                        <div>
                            <label
                                htmlFor="user-message"
                                className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2"
                            >
                                შეტყობინება *
                            </label>
                            <textarea
                                id="user-message"
                                name="message"
                                rows="5"
                                value={formData.message}
                                onChange={handleChange}
                                required
                                placeholder="ჩაწერეთ შეტყობინება..."
                                className="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-600 focus:bg-white transition-all text-sm sm:text-base resize-y"
                            ></textarea>
                        </div>

                        <div>
                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-blue-600 via-sky-500 to-indigo-600 text-white font-bold rounded-full shadow-lg shadow-blue-500/30 hover:shadow-xl hover:shadow-blue-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 cursor-pointer disabled:opacity-50"
                            >
                                {loading ? 'იგზავნება...' : 'შეტყობინების გაგზავნა'}
                            </button>
                        </div>
                    </form>
                </Section>
            );
        }

        /**
         * Footer კომპონენტი
         */
        function Footer() {
            const scrollToTop = () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <footer className="bg-white/90 backdrop-blur-md border-t border-slate-200 text-center py-10 px-4 mt-16 shadow-inner">
                    <div className="max-w-4xl mx-auto space-y-4">
                        <address className="not-italic">
                            <p className="font-bold text-slate-900 mb-3 text-base">საკონტაქტო ინფორმაცია:</p>
                            <ul className="flex flex-wrap justify-center gap-3 text-sm">
                                <li className="bg-blue-50 border border-blue-200/80 px-4 py-2 rounded-full text-slate-700">
                                    📧 Gmail:{' '}
                                    <a
                                        href="mailto:nika.ashvetiate08@geolab.edu.ge"
                                        className="text-blue-600 font-semibold hover:underline"
                                    >
                                        nika.ashvetiate08@geolab.edu.ge
                                    </a>
                                </li>
                                <li className="bg-blue-50 border border-blue-200/80 px-4 py-2 rounded-full text-slate-700">
                                    📞 ტელეფონი:{' '}
                                    <a
                                        href="tel:67676767"
                                        className="text-blue-600 font-semibold hover:underline"
                                    >
                                        67676767
                                    </a>
                                </li>
                            </ul>
                        </address>

                        <p className="text-xs sm:text-sm text-slate-500">
                            &copy; {new Date().getFullYear()} ნიკა აშვეთია. ყველა უფლება დაცულია.
                        </p>

                        <div>
                            <button
                                type="button"
                                onClick={scrollToTop}
                                className="cursor-pointer inline-block mt-2 text-xs font-bold text-blue-600 bg-slate-100 hover:bg-blue-600 hover:text-white px-4 py-2 rounded-full transition-all duration-200 shadow-sm"
                            >
                                ზემოთ ასვლა &uarr;
                            </button>
                        </div>
                    </div>
                </footer>
            );
        }

        // ==========================================================================
        // 4. მთავარი აპლიკაციის კომპონენტი (Root App Component)
        // ==========================================================================
        function App() {
            return (
                <div className="font-sans min-h-screen relative overflow-x-hidden text-slate-800">
                    {/* ფონის დეკორატიული გრადიენტური ბუშტები */}
                    <div className="fixed inset-0 pointer-events-none -z-10 overflow-hidden" aria-hidden="true">
                        <div className="absolute -top-24 -left-24 w-96 h-96 bg-blue-200/50 rounded-full blur-3xl"></div>
                        <div className="absolute top-1/4 -right-24 w-96 h-96 bg-amber-200/40 rounded-full blur-3xl"></div>
                        <div className="absolute bottom-10 left-1/3 w-[30rem] h-[30rem] bg-indigo-200/40 rounded-full blur-3xl"></div>
                    </div>

                    {/* ჰედერი და ნავიგაცია */}
                    <Navbar navLinks={NAV_LINKS} />

                    {/* ძირითადი შინაარსი */}
                    <main className="max-w-4xl mx-auto px-4 py-10 space-y-10">
                        {/* ჩემ შესახებ სექცია */}
                        <AboutSection />

                        {/* უნარების სექცია (გამეორებადი SkillCard კომპონენტებით) */}
                        <Section
                            id="skills"
                            title="ჩემი უნარები"
                            subtitle="ტექნოლოგიური და პიროვნული უნარები"
                        >
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                {SKILLS_DATA.map((skill) => (
                                    <SkillCard
                                        key={skill.id}
                                        title={skill.title}
                                        description={skill.description}
                                        icon={skill.icon}
                                        borderClass={skill.borderClass}
                                        badge={skill.badge}
                                    />
                                ))}
                            </div>
                        </Section>

                        {/* პროექტების სექცია (გამეორებადი ProjectCard კომპონენტებით) */}
                        <Section
                            id="projects"
                            title="პროექტები"
                            subtitle="შესრულებული და მიმდინარე სამუშაოები"
                        >
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                {PROJECTS_DATA.map((project) => (
                                    <ProjectCard
                                        key={project.id}
                                        title={project.title}
                                        description={project.description}
                                        icon={project.icon}
                                        status={project.status}
                                        statusColor={project.statusColor}
                                        tags={project.tags}
                                        link={project.link}
                                    />
                                ))}
                            </div>
                        </Section>

                        {/* განათლების სექცია (გამეორებადი EducationCard კომპონენტებით) */}
                        <Section id="education" title="განათლება">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {EDUCATION_DATA.map((edu) => (
                                    <EducationCard
                                        key={edu.id}
                                        title={edu.title}
                                        level={edu.level}
                                        badge={edu.badge}
                                        badgeColor={edu.badgeColor}
                                        icon={edu.icon}
                                        description={edu.description}
                                    />
                                ))}
                            </div>
                        </Section>

                        {/* მომხმარებლების სექცია (API + გამეორებადი UserCard კომპონენტები) */}
                        <UsersSection />

                        {/* კომენტარების სექცია (API + გამეორებადი CommentCard კომპონენტები) */}
                        <CommentsSection />

                        {/* საკონტაქტო ფორმა */}
                        <ContactSection />
                    </main>

                    {/* ფუტერი */}
                    <Footer />
                </div>
            );
        }

        // ==========================================================================
        // 5. React აპლიკაციის ინიციალიზაცია (Render)
        // ==========================================================================
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
