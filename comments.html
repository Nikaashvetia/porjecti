<!DOCTYPE html>
<html lang="ka" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>კომენტარები (250) - ნიკა აშვეთია</title>
    <link rel="stylesheet" href="./style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans Georgian"', '"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React 18, ReactDOM და Babel Standalone -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body id="top"
    class="font-sans bg-slate-50 text-slate-800 antialiased selection:bg-blue-500 selection:text-white min-h-screen relative overflow-x-hidden">

    <!-- React Root -->
    <div id="root">
        <div class="min-h-screen flex items-center justify-center text-slate-400 text-sm">
            იტვირთება კომენტარების გვერდი...
        </div>
    </div>

    <!-- React აპლიკაცია -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const NAV_LINKS = [
            { href: 'index.html#about', label: 'ჩემ შესახებ', icon: '👤' },
            { href: 'index.html#skills', label: 'უნარები', icon: '⚡' },
            { href: 'index.html#projects', label: 'პროექტები', icon: '🚀' },
            { href: 'index.html#education', label: 'განათლება', icon: '🎓' },
            { href: 'index.html#users', label: 'მომხმარებლები', icon: '👥' },
            { href: 'comments.html', label: 'კომენტარები', icon: '💬', active: true },
            { href: 'index.html#contact', label: 'კონტაქტი', icon: '✉️' },
        ];

        /**
         * ჰედერი და ნავიგაცია
         */
        function Navbar({ navLinks = [] }) {
            const [isOpen, setIsOpen] = useState(false);

            const toggleMenu = () => setIsOpen((prev) => !prev);
            const closeMenu = () => setIsOpen(false);

            return (
                <header className="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-sm transition-all duration-300 w-full">
                    <div className="w-full max-w-[1550px] mx-auto px-4 sm:px-8 lg:px-12 py-3 sm:py-3.5">
                        <div className="flex items-center justify-between gap-4">
                            {/* ლოგო და ავტორის სახელი */}
                            <div className="flex-shrink-0 text-left">
                                <a href="index.html" className="group block">
                                    <h1 className="text-xl sm:text-2xl lg:text-3xl font-extrabold bg-gradient-to-r from-blue-600 via-sky-500 to-indigo-600 bg-clip-text text-transparent tracking-tight group-hover:opacity-90 transition-opacity whitespace-nowrap">
                                        ჩემი პორტფოლიო
                                    </h1>
                                </a>
                                <p className="text-xs sm:text-sm text-slate-600 whitespace-nowrap mt-0.5">
                                    <span className="font-semibold text-slate-900">ნიკა აშვეთია</span> | Full Stack Development
                                </p>
                            </div>

                            {/* მობილურის Burger Menu ღილაკი */}
                            <div className="lg:hidden relative">
                                <button
                                    type="button"
                                    onClick={toggleMenu}
                                    aria-label={isOpen ? 'მენიუს დახურვა' : 'მენიუს გახსნა'}
                                    aria-expanded={isOpen}
                                    className="cursor-pointer inline-flex items-center justify-center p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 hover:text-blue-600 transition-colors shadow-sm border border-slate-200 select-none"
                                >
                                    {isOpen ? (
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    ) : (
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 6h16M4 12h16M4 18h16" />
                                        </svg>
                                    )}
                                </button>

                                {isOpen && (
                                    <div className="absolute right-0 top-full mt-2 w-56 bg-white/95 backdrop-blur-lg border border-slate-200 shadow-xl rounded-2xl p-3 transition-all z-50">
                                        <ul className="flex flex-col gap-1.5">
                                            <li>
                                                <a
                                                    href="index.html"
                                                    onClick={closeMenu}
                                                    className="block px-4 py-2 rounded-xl font-semibold text-slate-700 hover:text-blue-600 hover:bg-blue-50 transition-colors"
                                                >
                                                    🏠 მთავარი გვერდი
                                                </a>
                                            </li>
                                            {navLinks.map((link) => (
                                                <li key={link.href}>
                                                    <a
                                                        href={link.href}
                                                        onClick={closeMenu}
                                                        className={`block px-4 py-2 rounded-xl font-semibold transition-colors ${
                                                            link.active
                                                                ? 'bg-blue-600 text-white'
                                                                : 'text-slate-700 hover:text-blue-600 hover:bg-blue-50'
                                                        }`}
                                                    >
                                                        {link.icon} {link.label}
                                                    </a>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                )}
                            </div>

                            {/* დესკტოპ ნავიგაცია */}
                            <nav aria-label="მთავარი ნავიგაცია" className="hidden lg:flex items-center flex-shrink-0">
                                <ul className="flex items-center flex-nowrap whitespace-nowrap gap-1 xl:gap-2 bg-slate-100/90 border border-slate-200 p-1.5 rounded-full shadow-inner">
                                    <li>
                                        <a
                                            href="index.html"
                                            className="px-3 xl:px-4 py-1.5 text-xs xl:text-sm font-semibold text-slate-700 hover:text-blue-600 hover:bg-white rounded-full transition-all duration-200 block shadow-sm hover:shadow whitespace-nowrap"
                                        >
                                            🏠 მთავარი
                                        </a>
                                    </li>
                                    {navLinks.map((link) => (
                                        <li key={link.href}>
                                            <a
                                                href={link.href}
                                                className={`px-3 xl:px-4 py-1.5 text-xs xl:text-sm font-semibold rounded-full transition-all duration-200 block shadow-sm hover:shadow whitespace-nowrap ${
                                                    link.active
                                                        ? 'bg-blue-600 text-white shadow-md'
                                                        : 'text-slate-700 hover:text-blue-600 hover:bg-white'
                                                }`}
                                            >
                                                {link.label}
                                            </a>
                                        </li>
                                    ))}
                                </ul>
                            </nav>
                        </div>
                    </div>
                </header>
            );
        }

        /**
         * Reusable CommentCard ბარათი
         */
        function CommentCard({ index, id, name, email, body, searchQuery = '' }) {
            // ტექსტის მონიშვნა ძებნის დროს (Highlighting)
            const highlightText = (text, query) => {
                if (!query || !query.trim()) return text;
                const trimmed = query.trim();
                const regex = new RegExp(`(${trimmed.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                const parts = String(text).split(regex);
                return parts.map((part, i) =>
                    regex.test(part) ? (
                        <mark key={i} className="bg-amber-200 text-amber-950 px-1 rounded">
                            {part}
                        </mark>
                    ) : (
                        part
                    )
                );
            };

            return (
                <article className="bg-white p-5 sm:p-6 rounded-2xl border border-slate-200/90 shadow-sm hover:shadow-md hover:border-blue-200 transition-all duration-200 flex flex-col justify-between">
                    <div>
                        <div className="flex items-start justify-between gap-3 mb-2.5">
                            <div className="flex items-center gap-3 min-w-0">
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-400 text-white font-bold flex items-center justify-center text-xs shadow-sm flex-shrink-0">
                                    #{index}
                                </div>
                                <div className="min-w-0">
                                    <h4 className="font-bold text-slate-900 text-sm sm:text-base capitalize truncate">
                                        {highlightText(name, searchQuery)}
                                    </h4>
                                    <a
                                        href={`mailto:${email}`}
                                        className="text-xs text-blue-600 hover:text-blue-700 hover:underline flex items-center gap-1 truncate mt-0.5"
                                    >
                                        <span>📧</span>
                                        <span className="truncate">{highlightText(email, searchQuery)}</span>
                                    </a>
                                </div>
                            </div>
                            <span className="text-[11px] font-mono font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 border border-slate-200 flex-shrink-0">
                                ID: {id}
                            </span>
                        </div>

                        <p className="text-slate-600 text-sm leading-relaxed pl-4 border-l-2 border-amber-300 mt-3 italic bg-amber-50/40 p-3 rounded-r-xl">
                            "{highlightText(body, searchQuery)}"
                        </p>
                    </div>
                </article>
            );
        }

        /**
         * Comments Page - მთავარი კომპონენტი
         */
        function CommentsPage() {
            const [comments, setComments] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [currentPage, setCurrentPage] = useState(1);
            const [itemsPerPage, setItemsPerPage] = useState(15);

            useEffect(() => {
                // 500-დან ვიღებთ ზუსტად ნახევარს: 250 კომენტარს
                fetch('https://jsonplaceholder.typicode.com/comments?_limit=250')
                    .then((res) => {
                        if (!res.ok) throw new Error(`HTTP სტატუსი: ${res.status}`);
                        return res.json();
                    })
                    .then((data) => {
                        // დამატებითი გარანტია: მონაცემთა მასივიდან პირველი 250 ელემენტის აღება
                        const halfComments = data.slice(0, 250);
                        setComments(halfComments);
                        setLoading(false);
                    })
                    .catch((err) => {
                        console.error('შეცდომა კომენტარების ჩატვირთვისას:', err);
                        setError(err.message);
                        setLoading(false);
                    });
            }, []);

            // ძებნის ლოგიკა (Search filter)
            const filteredComments = useMemo(() => {
                if (!searchQuery.trim()) return comments;
                const q = searchQuery.toLowerCase().trim();
                return comments.filter((c) => {
                    const matchName = c.name?.toLowerCase().includes(q);
                    const matchEmail = c.email?.toLowerCase().includes(q);
                    const matchBody = c.body?.toLowerCase().includes(q);
                    const matchId = String(c.id).includes(q);
                    return matchName || matchEmail || matchBody || matchId;
                });
            }, [comments, searchQuery]);

            // გვერდზე გადართვისას საძიებო ცვლილების შემთხვევაში დაბრუნება 1-ლ გვერდზე
            useEffect(() => {
                setCurrentPage(1);
            }, [searchQuery, itemsPerPage]);

            // პაგინაცია (Pagination calculations)
            const totalItems = filteredComments.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
            const startIndex = (currentPage - 1) * itemsPerPage;
            const currentComments = filteredComments.slice(startIndex, startIndex + itemsPerPage);

            const handleClearSearch = () => {
                setSearchQuery('');
            };

            return (
                <div className="font-sans min-h-screen relative overflow-x-hidden text-slate-800 flex flex-col justify-between">
                    {/* ფონის დეკორატიული გრადიენტური ბუშტები */}
                    <div className="fixed inset-0 pointer-events-none -z-10 overflow-hidden" aria-hidden="true">
                        <div className="absolute -top-24 -left-24 w-96 h-96 bg-blue-200/50 rounded-full blur-3xl"></div>
                        <div className="absolute top-1/4 -right-24 w-96 h-96 bg-amber-200/40 rounded-full blur-3xl"></div>
                        <div className="absolute bottom-10 left-1/3 w-[30rem] h-[30rem] bg-indigo-200/40 rounded-full blur-3xl"></div>
                    </div>

                    <div>
                        {/* ჰედერი */}
                        <Navbar navLinks={NAV_LINKS} />

                        {/* მთავარი კონტენტი */}
                        <main className="w-full max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
                            {/* Breadcrumb & უკან დაბრუნების ბმული */}
                            <div className="mb-6 flex flex-wrap items-center justify-between gap-4">
                                <a
                                    href="index.html"
                                    className="inline-flex items-center gap-2 text-xs sm:text-sm font-bold text-blue-600 hover:text-blue-700 bg-white border border-blue-200/80 hover:border-blue-300 shadow-sm px-4 py-2.5 rounded-xl hover:shadow transition-all"
                                >
                                    <span>&larr;</span>
                                    <span>დაბრუნება მთავარ გვერდზე</span>
                                </a>

                                <div className="flex items-center gap-2">
                                    <span className="inline-flex items-center gap-1.5 bg-amber-100/90 text-amber-800 text-xs font-bold px-3 py-1.5 rounded-full border border-amber-300">
                                        <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                                        500-დან ამოღებულია: 250 კომენტარი (ნახევარი)
                                    </span>
                                </div>
                            </div>

                            {/* სათაურის ბლოკი */}
                            <div className="bg-white/90 backdrop-blur-sm border border-white/80 rounded-3xl p-6 sm:p-8 shadow-lg shadow-blue-500/5 mb-8">
                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-6 pb-6 border-b border-slate-100">
                                    <div>
                                        <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
                                            კომენტარების სრული სია (250)
                                        </h2>
                                        <p className="text-sm text-slate-500 mt-2">
                                            მონაცემები ჩამოტვირთულია JSONPlaceholder API-დან. სია შეიცავს ზუსტად 250 კომენტარს.
                                        </p>
                                    </div>

                                    {/* სტატისტიკური ბარათი */}
                                    <div className="flex items-center gap-3 bg-slate-50 border border-slate-200 p-3 rounded-2xl flex-shrink-0">
                                        <div className="text-3xl">💬</div>
                                        <div>
                                            <div className="text-xs text-slate-400 font-semibold uppercase">ბაზაში სულ</div>
                                            <div className="text-xl font-extrabold text-slate-800">250 კომენტარი</div>
                                        </div>
                                    </div>
                                </div>

                                {/* SEARCH BAR (საძიებო სისტემა) */}
                                <div className="mt-6">
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                            </svg>
                                        </div>

                                        <input
                                            type="text"
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            placeholder="მოძებნეთ კომენტარებში (სახელით, ელ-ფოსტით, ტექსტით ან ID-ით)..."
                                            className="w-full pl-11 pr-24 py-3.5 bg-slate-50/80 hover:bg-slate-50 focus:bg-white border border-slate-200 focus:border-blue-500 rounded-2xl text-sm sm:text-base text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-500/10 transition-all shadow-inner"
                                        />

                                        {searchQuery && (
                                            <button
                                                type="button"
                                                onClick={handleClearSearch}
                                                className="cursor-pointer absolute inset-y-0 right-3 my-auto h-8 px-3 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-600 text-xs font-bold transition-colors flex items-center gap-1"
                                                title="გასუფთავება"
                                            >
                                                <span>&times;</span>
                                                <span>გასუფთავება</span>
                                            </button>
                                        )}
                                    </div>

                                    {/* საძიებო შედეგების სტატუსი და პარამეტრები */}
                                    <div className="mt-4 flex flex-wrap items-center justify-between gap-3 text-xs sm:text-sm text-slate-600">
                                        <div>
                                            {searchQuery ? (
                                                <span>
                                                    საძიებო ფრაზით <strong className="text-blue-600">"{searchQuery}"</strong> ნაპოვნია:{' '}
                                                    <strong className="text-slate-900 font-bold">{totalItems}</strong> კომენტარი
                                                </span>
                                            ) : (
                                                <span>
                                                    ნაჩვენებია <strong className="text-slate-900 font-bold">{totalItems}</strong> კომენტარი (სულ 250-დან)
                                                </span>
                                            )}
                                        </div>

                                        {/* გვერდზე ელემენტების რაოდენობის არჩევა */}
                                        <div className="flex items-center gap-2">
                                            <span className="text-slate-400">გვერდზე:</span>
                                            <select
                                                value={itemsPerPage}
                                                onChange={(e) => setItemsPerPage(Number(e.target.value))}
                                                className="bg-slate-100 border border-slate-200 rounded-lg px-2.5 py-1 text-xs font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            >
                                                <option value={10}>10</option>
                                                <option value={15}>15</option>
                                                <option value={25}>25</option>
                                                <option value={50}>50</option>
                                                <option value={250}>ყველა (250)</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* შეცდომის შეტყობინება */}
                            {error && (
                                <div className="p-4 rounded-2xl bg-red-50 text-red-600 text-sm text-center border border-red-200 mb-8">
                                    შეცდომა კომენტარების ჩატვირთვისას: {error}
                                </div>
                            )}

                            {/* ჩატვირთვის ინდიკატორი */}
                            {loading && (
                                <div className="text-center py-20 text-slate-400 text-base flex flex-col items-center justify-center gap-3">
                                    <svg className="animate-spin h-8 w-8 text-blue-600" viewBox="0 0 24 24" fill="none">
                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                                    </svg>
                                    <span>იტვირთება 250 კომენტარი JSONPlaceholder API-დან...</span>
                                </div>
                            )}

                            {/* ცარიელი რეზულტატი (ვერ მოიძებნა) */}
                            {!loading && !error && filteredComments.length === 0 && (
                                <div className="bg-white rounded-3xl border border-slate-200 p-12 text-center shadow-sm max-w-lg mx-auto">
                                    <div className="text-5xl mb-3">🔍</div>
                                    <h3 className="text-lg font-bold text-slate-800 mb-1">კომენტარი ვერ მოიძებნა</h3>
                                    <p className="text-sm text-slate-500 mb-5">
                                        საძიებო სიტყვით "{searchQuery}" არცერთი კომენტარი არ მოიძებნა.
                                    </p>
                                    <button
                                        type="button"
                                        onClick={handleClearSearch}
                                        className="cursor-pointer px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl transition-all shadow-md shadow-blue-500/20"
                                    >
                                        ძებნის გასუფთავება
                                    </button>
                                </div>
                            )}

                            {/* კომენტარების ბარათების სია */}
                            {!loading && !error && filteredComments.length > 0 && (
                                <>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
                                        {currentComments.map((comment, idx) => (
                                            <CommentCard
                                                key={comment.id}
                                                index={startIndex + idx + 1}
                                                id={comment.id}
                                                name={comment.name}
                                                email={comment.email}
                                                body={comment.body}
                                                searchQuery={searchQuery}
                                            />
                                        ))}
                                    </div>

                                    {/* პაგინაციის კონტროლი */}
                                    {totalPages > 1 && (
                                        <div className="mt-10 flex flex-wrap items-center justify-center gap-2">
                                            {/* წინა გვერდი */}
                                            <button
                                                type="button"
                                                onClick={() => setCurrentPage((p) => Math.max(p - 1, 1))}
                                                disabled={currentPage === 1}
                                                className={`cursor-pointer px-4 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all ${
                                                    currentPage === 1
                                                        ? 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed'
                                                        : 'bg-white text-slate-700 border-slate-200 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 shadow-sm'
                                                }`}
                                            >
                                                &larr; წინა
                                            </button>

                                            {/* გვერდის ნომრები */}
                                            <div className="flex items-center gap-1">
                                                {Array.from({ length: totalPages }, (_, i) => i + 1)
                                                    .filter((p) => {
                                                        // ვაჩვენებთ პირველ, ბოლო და მიმდინარე გვერდის გარშემო 2 გვერდს
                                                        return p === 1 || p === totalPages || Math.abs(p - currentPage) <= 2;
                                                    })
                                                    .map((pageNum, idx, arr) => {
                                                        const prev = arr[idx - 1];
                                                        const showEllipsis = prev && pageNum - prev > 1;

                                                        return (
                                                            <React.Fragment key={pageNum}>
                                                                {showEllipsis && (
                                                                    <span className="px-2 text-slate-400 text-xs">...</span>
                                                                )}
                                                                <button
                                                                    type="button"
                                                                    onClick={() => setCurrentPage(pageNum)}
                                                                    className={`cursor-pointer w-9 h-9 rounded-xl text-xs font-bold transition-all ${
                                                                        currentPage === pageNum
                                                                            ? 'bg-blue-600 text-white shadow-md shadow-blue-500/25'
                                                                            : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-100'
                                                                    }`}
                                                                >
                                                                    {pageNum}
                                                                </button>
                                                            </React.Fragment>
                                                        );
                                                    })}
                                            </div>

                                            {/* შემდეგი გვერდი */}
                                            <button
                                                type="button"
                                                onClick={() => setCurrentPage((p) => Math.min(p + 1, totalPages))}
                                                disabled={currentPage === totalPages}
                                                className={`cursor-pointer px-4 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all ${
                                                    currentPage === totalPages
                                                        ? 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed'
                                                        : 'bg-white text-slate-700 border-slate-200 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 shadow-sm'
                                                }`}
                                            >
                                                შემდეგი &rarr;
                                            </button>
                                        </div>
                                    )}

                                    {/* გვერდის ინდიკატორი */}
                                    <div className="text-center text-xs text-slate-400 mt-4">
                                        გვერდი {currentPage} / {totalPages} (ნაჩვენებია {startIndex + 1} - {Math.min(startIndex + itemsPerPage, totalItems)} სულ {totalItems}-დან)
                                    </div>
                                </>
                            )}
                        </main>
                    </div>

                    {/* ფუტერი */}
                    <footer className="bg-white/80 border-t border-slate-200/80 mt-16 py-8">
                        <div className="w-full max-w-[1400px] mx-auto px-4 text-center text-xs text-slate-500">
                            <p>© 2026 ნიკა აშვეთია. ყველა უფლება დაცულია.</p>
                            <a
                                href="#top"
                                className="cursor-pointer inline-block mt-3 text-xs font-bold text-blue-600 bg-slate-100 hover:bg-blue-600 hover:text-white px-4 py-2 rounded-full transition-all duration-200 shadow-sm"
                            >
                                ზემოთ ასვლა &uarr;
                            </a>
                        </div>
                    </footer>
                </div>
            );
        }

        // Render
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<CommentsPage />);
    </script>
</body>

</html>
